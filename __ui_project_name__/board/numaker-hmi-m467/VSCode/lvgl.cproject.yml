project:
  packs:
    - pack: Nuvoton::NuMicro_DFP
  setups:
    - output:
        # bin, elf, hex, lib
        type: bin
    - setup: Options for M467HJ480x272FSA506, M467HJ480x272SSD1963
      processor:
        fpu: sp
      add-path:
        - ..
        - ../../../bsp/m460/Library/CMSIS/Include
        - ../../../bsp/m460/Library/Device/Nuvoton/m460/Include
        - ../../../bsp/m460/Library/StdDriver/inc
        - ../../../thirdparty/FreeRTOS/portable/GCC/ARM_CM4F
        - ../../../thirdparty/FreeRTOS/include
        - ../../../common
        - ../../../common/drv_disp
        - ../../../common/drv_indev
        - ../lv_port
        - ../../../lvgl/src
        - ../../../lvgl/src/core
        - ../../../lvgl/src/draw
        - ../../../lvgl/src/draw/sw
        - ../../../lvgl/src/font
        - ../../../lvgl/src/misc
        - ../../../lvgl/src/widgets
        - ../../..
        - ../sls_files
      debug: "on"
      define:
        - __480x272__
        - CPU_CORTEX_M4
        - LV_CONF_INCLUDE_SIMPLE
        - M467HJ
      misc:
        - C:
            - -std=gnu11
          C-CPP:
            - -mthumb
            - -masm-syntax-unified
            - -fmessage-length=0
            - -fsigned-char
            - -ffunction-sections
            - -fdata-sections
            - -g
          Link:
            - -mthumb
            - -fmessage-length=0
            - -fsigned-char
            - -g
            - --specs=nano.specs
            - --specs=nosys.specs
            - -Wl,--gc-sections,-Map=$elf()$.map
  linker:
    - script: M460.ld
  groups:
    - group: src
      files:
        - file: ../main.c
          misc:
            - C-CPP:
                - -w
              CPP:
                - -xc++
        - file: ../components/task_lv.c
        - file: ../FreeRTOSConfig.h
    - group: libraries
      files:
        - file: ../../../bsp/m460/Library/StdDriver/src/clk.c
        - file: ../../../bsp/m460/Library/StdDriver/src/ebi.c
        - file: ../../../bsp/m460/Library/StdDriver/src/gpio.c
